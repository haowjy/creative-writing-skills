name: Release

# Every push to main reads the version in mars.toml. When that version has no tag yet,
# CI runs the checks and, only if they pass, tags this commit and publishes the
# release. The author never tags locally (`mars version --no-tag`), so a commit that
# fails a check never becomes a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue rather than cancel: a second push waits for the first to finish tagging, then
# sees its tag and exits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      needed: ${{ steps.read.outputs.needed }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' mars.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged: nothing to release"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [plan, checks]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version everywhere and the changelog section
        run: scripts/check_release.sh "$VERSION" "$RUNNER_TEMP/notes.md"

      - name: Tag this commit
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Build Claude.ai skill packages
        run: python3 scripts/create_skill_zips.py

      - name: Create GitHub Release
        run: gh release create "v$VERSION" zips/*.skill --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
